<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🌤 WeatherWise Dashboard</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="city.html">City Details</a> |
        <a href="saved.html">Saved Cities</a>
    </nav>
</header>

<main>

<section class="card">
    <h2>Search Weather</h2>

    <label for="cityInput">City Name</label><br>
    <input type="text" id="cityInput" placeholder="Enter city name">

    <br><br>

    <button id="searchBtn">Search</button>
</section>

<section class="card">
    <h2>Current Weather</h2>

    <p><strong>City:</strong> <span id="cityName">--</span></p>
    <p><strong>Temperature:</strong> <span id="temperature">--°C</span></p>
    <p><strong>Wind Speed:</strong> <span id="wind">-- km/h</span></p>
</section>

</main>

<footer>
    <p>&copy; 2026 WeatherWise</p>
</footer>

<script src="script.js"></script>

</body>
</html>
